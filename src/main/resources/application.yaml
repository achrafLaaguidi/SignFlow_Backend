spring:
  application:
    name: SignFlow

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:signflow_db}?sslmode=${DB_SSL_MODE:disable}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: false
        multiTenancy: SCHEMA

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:10MB}

  web:
    resources:
      add-mappings: false
    error:
      include-message: always

server:
  port: ${SERVER_PORT:8080}

application:
  central:
    super-admin:
      email: ${SUPER_ADMIN_EMAIL:achraflaaguidi9@gmail.com}
      password: ${SUPER_ADMIN_PASSWORD:ADMIN}
      name: ${SUPER_ADMIN_NAME:achraf laaguidi}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://*.signflow.local:*}
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      expiration: ${JWT_EXPIRATION:900000}
      cookie-domain: ${COOKIE_DOMAIN:signflow.local}
      refresh-token:
        expiration: ${JWT_REFRESH_EXPIRATION:604800000}

minio:
  url: ${MINIO_URL:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket-name: ${MINIO_BUCKET_NAME:signflow-documents}
  connect-timeout: ${MINIO_CONNECT_TIMEOUT:10000}
  write-timeout: ${MINIO_WRITE_TIMEOUT:30000}
  read-timeout: ${MINIO_READ_TIMEOUT:30000}
  use-ssl: ${MINIO_USE_SSL:false}